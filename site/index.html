<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Scoreboard</title>
<meta name="description" content="Australian athletes ranked by Instagram followers, updated daily.">
<meta name="theme-color" content="#0E1430">
<meta property="og:type" content="website">
<meta property="og:title" content="Social Scoreboard">
<meta property="og:description" content="Australian athletes ranked by Instagram. Updated daily.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E1430'/%3E%3Cpath d='M9 25 19 7h5L14 25z' fill='%23FF7A1A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E1430;
    --bg-2: #141B3D;
    --card: #18204A;
    --card-2: #222D5C;
    --text: #F4F1EA;
    --cream: #F4F1EA;
    --ink: #121212;
    --muted: #9AA3C7;
    --line: #26305A;
    --accent: #FF7A1A;
    --accent-2: #FF7A1A;
    --up: #4BE38E;
    --down: #FF5C7A;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --serif: "Fraunces", Georgia, serif;
    --hand: "Caveat", "Segoe Script", cursive;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0; color: var(--text); font: 16px/1.5 "Barlow", system-ui, sans-serif;
    background: var(--bg);
    min-height: 100vh;
  }
  a { color: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  .up { color: var(--up); } .down { color: var(--down); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

  /* ---------- top bar ---------- */
  .bar { position: sticky; top: 0; z-index: 10; backdrop-filter: blur(12px); background: rgba(14,20,48,.8); border-bottom: 1px solid var(--line); }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; height: 58px; }
  .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 800 22px/1 var(--display); letter-spacing: .01em; }
  .logo i { width: 26px; height: 26px; border-radius: 7px; background: var(--accent); position: relative; overflow: hidden; }
  .logo i::after { content: ""; position: absolute; inset: -4px 9px; background: var(--bg); transform: skewX(-24deg); }
  .bar .updated { color: var(--muted); font-size: 14px; }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--up); margin-right: 7px; box-shadow: 0 0 0 4px rgba(60,224,160,.18); }

  /* ---------- menu ---------- */
  .bar .wrap { gap: 16px; }
  .nav { display: flex; gap: 4px; margin-left: auto; }
  .nav > a, .nav summary {
    list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    font: 600 15px/1 "Barlow", sans-serif; color: var(--muted); text-decoration: none;
    padding: 10px 12px; border-radius: 10px;
  }
  .nav summary::-webkit-details-marker { display: none; }
  .nav summary::after { content: ""; width: 7px; height: 7px; border: solid currentColor; border-width: 0 2px 2px 0; transform: rotate(45deg) translateY(-2px); }
  .nav > a:hover, .nav summary:hover, .nav details[open] summary { color: var(--text); background: var(--bg-2); }
  .nav details { position: relative; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 8px); min-width: 290px; z-index: 30;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px;
    box-shadow: 0 18px 40px -12px rgba(0,0,0,.55);
  }
  .menu a { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 9px; text-decoration: none; color: var(--text); font-weight: 600; }
  .menu a small { color: var(--muted); font-weight: 500; white-space: nowrap; }
  .menu a:hover { background: var(--card-2); }
  .menu h4 { margin: 10px 12px 4px; font: 800 17px/1 var(--display); color: var(--accent); }
  .menu .sub { margin-left: 12px; border-left: 1px solid var(--line); padding-left: 4px; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

  /* ---------- home ---------- */
  .home-hero { padding: 36px 0 26px; }
  .home-hero h1 { font: 900 clamp(40px, 6vw, 72px)/.9 var(--display); margin: 0; letter-spacing: -.01em; max-width: 16ch; }
  .home-hero h1 em { font-style: inherit; color: var(--accent); }
  .home-hero .lede { color: var(--muted); max-width: 56ch; margin: 14px 0 0; font-size: 17px; }
  .lists { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px 16px 10px; display: flex; flex-direction: column; }
  .list h2 { font: 800 28px/1 var(--display); margin: 0 4px 4px; }
  .list .hint { color: var(--muted); font-size: 14px; margin: 0 4px 10px; }
  .list.rising { background: linear-gradient(160deg, rgba(255,122,26,.14), rgba(176,124,255,.12)), var(--card); }
  .row { display: grid; grid-template-columns: 26px 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 12px; text-decoration: none; }
  .row:hover { background: var(--card-2); }
  .row .n { font: 800 22px/1 var(--display); color: var(--muted); text-align: center; }
  .row:nth-child(-n+3) .n { color: var(--accent); }
  .row .av { width: 40px; height: 40px; border-radius: 11px; overflow: hidden; position: relative; background: var(--card-2); }
  .row .av img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .row .av .ph { font-size: 17px; padding: 0; }
  .row .who { min-width: 0; }
  .row .who b { display: block; font: 700 19px/1.1 var(--display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .who span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .val { text-align: right; }
  .row .val b { display: block; font: 800 20px/1 var(--display); }
  .row .val small { color: var(--muted); font-size: 12px; }
  .list .all { margin: auto 4px 6px; padding-top: 10px; color: var(--accent); font-weight: 700; text-decoration: none; }
  .list .empty { color: var(--muted); margin: 8px 4px 16px; }
  .widget { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
  .widget-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .widget h2 { font: 800 28px/1 var(--display); margin: 0 0 4px; }
  .widget .hint { color: var(--muted); font-size: 14px; margin: 0; }
  .wrows { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .wrow { background: var(--bg-2); border-radius: 14px; padding: 14px; border: 1px solid var(--line); text-decoration: none; }
  .wrow .n { font: 900 30px/1 var(--display); color: var(--accent); }
  .wrow b { display: block; font: 800 20px/1.1 var(--display); margin: 8px 0 2px; }
  .wrow span { color: var(--muted); font-size: 13px; }
  .wrow .pct { display: block; font: 800 26px/1 var(--display); margin-top: 10px; }
  .seg { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 99px; }
  .seg button { font: 700 14px/1 "Barlow", sans-serif; border: 0; background: none; color: var(--muted); padding: 9px 13px; border-radius: 99px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--card-2); color: var(--text); }

  /* ---------- hero ---------- */
  .hero { padding: 44px 0 28px; position: relative; }
  .hero h1 {
    font: 900 clamp(48px, 9vw, 112px)/.86 var(--display);
    margin: 0; letter-spacing: -.015em; max-width: 11ch; text-wrap: balance;
  }
  .hero h1 em { font-style: inherit; color: var(--accent); }
  .hero .lede { color: var(--muted); max-width: 46ch; margin: 18px 0 0; font-size: 18px; }
  .totals { display: flex; gap: 36px; margin-top: 26px; flex-wrap: wrap; }
  .totals b { display: block; font: 800 44px/1 var(--display); }
  .totals span { color: var(--muted); font-size: 14px; }

  .notice { background: rgba(255,122,26,.12); border: 1px solid rgba(255,122,26,.4); color: #FFC9A3; border-radius: 12px; padding: 11px 15px; margin-bottom: 18px; font-size: 15px; }

  /* ---------- tabs ---------- */
  .tabs { display: flex; gap: 8px; margin: 8px 0 22px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    font: 600 16px/1 "Barlow", sans-serif; border: 1px solid var(--line); background: var(--bg-2);
    color: var(--muted); padding: 11px 16px; border-radius: 99px; cursor: pointer; white-space: nowrap;
  }
  .tabs button:hover { color: var(--text); }
  .tabs button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #1A0B00; }
  .tabs.leagues { margin-bottom: 0; }
  .tabs.sports { margin-bottom: 0; }
  .tabs.sports button { font: 800 19px/1 var(--display); letter-spacing: .01em; border-radius: 10px; padding: 12px 16px; }
  .tabs.sports button[aria-selected="true"] { background: linear-gradient(120deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; }
  .tabs.leagues button[aria-selected="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }

  /* ---------- player cards ---------- */
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; text-decoration: none; background: var(--card);
    border-radius: 18px; overflow: hidden; border: 1px solid var(--line);
    transition: transform .18s ease, border-color .18s ease;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(255,122,26,.6); }
  .shot { position: relative; aspect-ratio: 4 / 4.4; overflow: hidden; background: var(--card-2); }
  .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, rgba(10,14,36,.94) 100%); }
  .ph {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: repeating-linear-gradient(-62deg, transparent 0 22px, rgba(255,255,255,.035) 22px 44px), linear-gradient(155deg, #FF7A1A 0%, #C2459E 55%, #6B4DFF 100%);
    font: 900 clamp(56px, 8vw, 92px)/1 var(--display); color: rgba(255,255,255,.9); padding-bottom: 18%;
  }
  .rank {
    position: absolute; z-index: 2; top: 8px; left: 14px;
    font: 900 64px/1 var(--display); color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.75);
  }
  .card.podium .rank { -webkit-text-stroke: 0; color: var(--accent); text-shadow: 0 4px 18px rgba(0,0,0,.35); }
  .shot-foot { position: absolute; z-index: 2; left: 16px; right: 16px; bottom: 14px; }
  .name { font: 800 28px/.95 var(--display); display: block; }
  .team { color: #C8CEE6; font-size: 14px; display: block; margin-top: 4px; }
  .tick { display: inline-block; width: .62em; height: .62em; margin-left: 6px; vertical-align: .08em; }
  .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 14px 16px 4px; }
  .meta b { font: 800 34px/1 var(--display); }
  .meta small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
  .chip { font: 700 13px/1 "Barlow", sans-serif; padding: 6px 9px; border-radius: 99px; white-space: nowrap; }
  .chip.up { background: rgba(60,224,160,.14); } .chip.down { background: rgba(255,92,122,.14); }
  .spark { display: block; width: 100%; height: 40px; margin-top: auto; }

  /* featured #1 */
  .card.feature { grid-column: span 2; grid-row: span 1; flex-direction: row; }
  .card.feature .shot { flex: 0 0 52%; aspect-ratio: auto; min-height: 100%; }
  .card.feature .side { flex: 1; display: flex; flex-direction: column; padding: 20px 20px 0; min-width: 0; }
  .card.feature .lead { color: var(--accent); font-weight: 700; font-size: 14px; }
  .card.feature .big { font: 900 64px/.9 var(--display); margin: 8px 0 4px; }
  .card.feature .rows { display: grid; gap: 10px; margin: 14px 0 12px; }
  .card.feature .rows div { display: flex; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 10px; color: var(--muted); font-size: 14px; }
  .card.feature .rows b { color: var(--text); font: 700 20px/1 var(--display); }
  .card.feature .spark { height: 64px; margin: auto -20px 0; width: calc(100% + 40px); }
  .card.feature .name { font-size: 40px; }

  .waiting { color: var(--muted); margin-top: 18px; }
  details.waiting summary { cursor: pointer; font-weight: 600; }
  .more { display: flex; justify-content: center; margin-top: 22px; }
  .finder { display: flex; gap: 12px; align-items: center; margin: -8px 0 20px; flex-wrap: wrap; }
  .finder input[type=search] {
    flex: 1 1 260px; max-width: 420px; font: 500 16px/1 "Barlow", sans-serif; color: var(--text);
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 99px; padding: 12px 18px;
  }
  .finder input[type=search]::placeholder { color: var(--muted); }
  .toggle { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); font-weight: 600; cursor: pointer; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--accent); }
  .badge { display: inline-block; font: 700 12px/1 "Barlow", sans-serif; padding: 5px 8px; border-radius: 99px; background: rgba(176,124,255,.18); color: #D9C4FF; vertical-align: middle; margin-left: 8px; }

  /* ---------- profile ---------- */
  .back { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); text-decoration: none; font-weight: 600; margin: 26px 0 18px; }
  .back:hover { color: var(--text); }
  .pro { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: end; margin-bottom: 28px; }
  .pro .shot { border-radius: 20px; aspect-ratio: 4 / 4.6; border: 1px solid var(--line); }
  .pro .shot::after { background: linear-gradient(180deg, transparent 60%, rgba(10,14,36,.7)); }
  .pro .rank { font-size: 84px; top: 10px; left: 18px; }
  .pro .ph { font-size: 120px; padding-bottom: 0; }
  .pro h1 { font: 900 clamp(52px, 8vw, 104px)/.86 var(--display); margin: 0; letter-spacing: -.015em; }
  .pro .sub { color: var(--muted); margin-top: 10px; font-size: 17px; }
  .pro .bio { white-space: pre-line; margin: 14px 0 0; max-width: 56ch; }
  .actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; font: 700 15px/1 "Barlow", sans-serif;
    padding: 12px 18px; border-radius: 99px; text-decoration: none; cursor: pointer; border: 1px solid var(--line); background: var(--bg-2); color: var(--text);
  }
  .btn.primary { background: var(--accent); color: #1A0B00; border-color: var(--accent); }
  .btn svg { width: 18px; height: 18px; }

  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
  .tile b { display: block; font: 800 clamp(26px, 3.4vw, 40px)/1 var(--display); white-space: nowrap; }
  .tile span { color: var(--muted); font-size: 14px; }
  .tile.hot { background: var(--accent); color: #1A0B00; border-color: var(--accent); }
  .tile.hot span { color: #5C2A00; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px; margin-bottom: 16px; }
  .panel h2 { font: 800 30px/1 var(--display); margin: 0 0 6px; }
  .panel .hint { color: var(--muted); margin: 0 0 14px; font-size: 15px; }
  .chart-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
  .range { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 99px; }
  .range button { font: 700 14px/1 "Barlow", sans-serif; border: 0; background: none; color: var(--muted); padding: 9px 13px; border-radius: 99px; cursor: pointer; }
  .range button[aria-pressed="true"] { background: var(--card-2); color: var(--text); }
  .chart { position: relative; height: 280px; margin-top: 8px; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .chart .lbl { font: 12px "Barlow", sans-serif; fill: var(--muted); }
  .tip { position: absolute; top: 0; pointer-events: none; background: var(--accent); color: #1A0B00; border-radius: 8px; padding: 6px 10px; font-size: 13px; white-space: nowrap; transform: translateX(-50%); display: none; font-weight: 600; }
  .tip b { font: 800 19px/1 var(--display); display: block; }
  .feature-hl {
    display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: center;
    background: linear-gradient(120deg, rgba(255,122,26,.16), rgba(176,124,255,.14)), var(--card);
    border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-bottom: 16px;
  }
  .hl-thumb { position: relative; display: block; padding: 0; border: 0; cursor: pointer; border-radius: 14px; overflow: hidden; aspect-ratio: 4 / 5; background: var(--card-2); }
  .hl-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .3s ease; }
  .hl-thumb:hover img { transform: scale(1.03); }
  .hl-thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(10,14,36,.55)); }
  .hl-play { position: absolute; inset: 0; display: grid; place-items: center; z-index: 1; }
  .hl-play svg { width: 72px; height: 72px; filter: drop-shadow(0 6px 18px rgba(0,0,0,.4)); color: #fff; }
  .hl-embed .instagram-media { margin: 0 !important; min-width: 0 !important; width: 100% !important; border-radius: 14px !important; }
  .hl-kicker { color: var(--accent); font-weight: 700; font-size: 14px; }
  .hl-cap { font: 700 clamp(22px, 2.6vw, 30px)/1.15 var(--display); margin: 8px 0 0; max-width: 40ch; }
  @media (max-width: 720px) { .feature-hl { grid-template-columns: 1fr; } .hl-thumb { max-height: 70vh; } }
  @media (prefers-reduced-motion: reduce) { .hl-thumb img { transition: none; } }
  .strip { display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; margin: 0 -4px; }
  .strip::-webkit-scrollbar { height: 8px; } .strip::-webkit-scrollbar-thumb { background: var(--card-2); border-radius: 8px; }
  .post { flex: 0 0 328px; max-width: 86vw; scroll-snap-align: start; }
  .post .instagram-media { margin: 0 !important; min-width: 0 !important; width: 100% !important; border-radius: 14px !important; }
  .post-ph {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; height: 420px;
    border-radius: 14px; text-decoration: none; color: var(--muted); font-weight: 600;
    background: repeating-linear-gradient(-62deg, transparent 0 22px, rgba(255,255,255,.03) 22px 44px), var(--card-2);
  }
  .post-ph svg { width: 44px; height: 44px; color: var(--text); }
  .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 20px; }
  .facts b { display: block; font: 800 30px/1.05 var(--display); }
  .facts span { color: var(--muted); font-size: 14px; }
  .eng { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
  .eng b { display: block; font: 800 34px/1 var(--display); }
  .eng span { color: var(--muted); font-size: 14px; }

  .pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 24px; }
  .pager a { display: flex; align-items: center; gap: 12px; text-decoration: none; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; }
  .pager a:hover { border-color: rgba(255,122,26,.6); }
  .pager a.next { justify-content: flex-end; text-align: right; }
  .pager .mini { width: 46px; height: 46px; border-radius: 12px; overflow: hidden; flex: none; position: relative; background: var(--card-2); }
  .pager .mini img { width: 100%; height: 100%; object-fit: cover; }
  .pager .mini .ph { font-size: 20px; padding: 0; }
  .pager small { display: block; color: var(--muted); }
  .pager span b { font: 800 22px/1.05 var(--display); }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--accent); color: #1A0B00; font-weight: 700; padding: 11px 18px; border-radius: 99px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
  .toast.show { opacity: 1; }

  footer { color: var(--muted); font-size: 14px; padding: 18px 0 44px; border-top: 1px solid var(--line); margin-top: 32px; }
  footer p { margin: 4px 0; max-width: 72ch; }

  /* ---------- responsive ---------- */
  @media (max-width: 960px) {
    .lists { grid-template-columns: 1fr 1fr; }
    .lists .rising { grid-column: span 2; }
    .wrows { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .eng { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 720px) {
    .lists { grid-template-columns: 1fr; }
    .lists .rising { grid-column: auto; }
    .wrows { grid-template-columns: 1fr; }

<body>
<div class="bar">
  <div class="wrap">
    <a class="logo" href="#/"><i aria-hidden="true"></i><span id="siteName">Social Scoreboard</span></a>
    <nav class="nav" id="nav" aria-label="Main"></nav>
    <span class="updated" id="updated"></span>
  </div>
</div>
<main class="wrap" id="main"></main>
<footer class="wrap">
  <p>Follower numbers come from public Instagram accounts through Meta's official API. Player details come from the leagues' official stats.</p>
  <p>Not affiliated with any league, team or governing body.</p>
</footer>
<div class="toast" id="toast" role="status"></div>

<script>
/* ---------------------------------------------------------------- setup */
// Change the site's name here (also update the <title> and og:title tags at the top).
const SITE_NAME = "Social Scoreboard";
// Phase 1 tracks followers only. Switch this to true when engagement
// (likes, comments, posts) is being collected, to show those features.
const SHOW_ENGAGEMENT = false;

const VIEWS = {
  followers:  { key: "followers",       tab: "Most followed",       label: "followers",  fmt: v => compact(v) },
  growth7:    { abs: "change_7d", key: "change_7d_pct",   tab: "Hot this week",       label: "this week",  fmt: v => signed(v) + "%", change: true },
  growth30:   { abs: "change_30d", key: "change_30d_pct",  tab: "Hot this month",      label: "this month", fmt: v => signed(v) + "%", change: true },
  engagement: { key: "engagement_rate", tab: "Best engagement",     label: "engagement", fmt: v => v.toFixed(2) + "%" },
};
if (!SHOW_ENGAGEMENT) delete VIEWS.engagement;
const RANGES = { "30D": 30, "90D": 90, "1Y": 365, "All": Infinity };
const PAGE_SIZE = 24;
// Order and wording for each sport. Add an entry here when adding a new sport.
const SPORT_ORDER = ["Basketball", "Soccer", "American football"];
const SPORT_LABEL = { "American football": "NFL" };
const LEAGUE_ORDER = ["NBA", "WNBA", "NBL", "WNBL", "Matildas", "Socceroos", "NFL"];
const GENDER_LABEL = { men: "Men", women: "Women" };
const UP_AND_COMING_CAP = 100000;   // "Up & coming" only includes accounts below this many followers
const SPORT_COPY = {
  All: { headline: "Australia’s athletes", lede: "Followers and growth for Australian athletes and the players in our leagues, across basketball, soccer and the NFL", count: "athletes tracked" },
  Basketball: { headline: "Australian basketball", lede: "Followers and growth for every Aussie in the NBA and WNBA, and every player in the NBL and WNBL", count: "players tracked" },
  Soccer: { headline: "The Matildas & Socceroos", lede: "Followers and growth for every player in the latest Matildas and Socceroos squads", count: "national team players" },
  "American football": { headline: "Every Aussie in the NFL", lede: "Followers and growth for the Australians on NFL rosters", count: "Aussies in the NFL" },
};
let DATA = null, sport = "All", league = "All", gender = "All", aussiesOnly = false, query = "", shown = PAGE_SIZE, view = "followers", range = "90D", current = null;
const $ = id => document.getElementById(id);

function compact(n) {
  if (n == null) return "–";
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2).replace(/\.?0+$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(n >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "K";
  return String(n);
}
function exact(n) { return Number(n).toLocaleString("en-AU"); }
function exactSigned(n) { return (n >= 0 ? "+" : "−") + exact(Math.abs(n)); }
function signed(n) { return (n > 0 ? "+" : "") + (Math.abs(n) < 10 ? n.toFixed(2) : n.toFixed(1)); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
function ordinal(n) { const s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function initials(name) { return name.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase(); }
function niceDate(iso, opts = { day: "numeric", month: "short" }) { return new Date(iso + "T12:00:00").toLocaleDateString("en-AU", opts); }
// The team an athlete plays for in a given league (or their main team).
function teamIn(p, lg) {
  const t = (p.teams || []).find(t => t[0] === lg) || (p.teams || [])[0] || [p.league, p.team, p.position];
  return { league: t[0], team: t[1], position: t[2] };
}
function inLeague(p, lg) { return (p.leagues || [p.league]).includes(lg); }
// Rank by followers within one league.
function leagueRank(p, lg) {
  const r = DATA.players.filter(x => x.followers != null && inLeague(x, lg)).sort((a, b) => b.followers - a.followers);
  const i = r.findIndex(x => x.id === p.id);
  return { rank: i >= 0 ? i + 1 : null, of: r.length, list: r };
}
function shortTeam(t, sport) {
  // "Chicago Bulls" -> "Bulls" for US-style team names; club names (soccer) stay whole.
  if (sport === "Soccer") return t;
  const w = t.split(" "); return w.at(-2) === "Trail" ? "Trail Blazers" : w.at(-1);
}
function nameLines(n) { const i = n.indexOf(" "); return i < 0 ? esc(n) : esc(n.slice(0, i)) + "<br>" + esc(n.slice(i + 1)); }

function photo(p) {
  const ph = `<span class="ph">${esc(initials(p.name))}</span>`;
  return p.photo ? `<img src="${esc(p.photo)}" alt="${esc(p.name)}" loading="lazy" data-initials="${esc(initials(p.name))}" onerror="imgFail(this)">` : ph;
}
// If a photo can't load, show the initials card instead.
function imgFail(img) {
  const ph = document.createElement("span");
  ph.className = "ph";
  ph.textContent = img.dataset.initials || "";
  img.replaceWith(ph);
}
const TICK = `<svg class="tick" viewBox="0 0 24 24" aria-label="Verified"><circle cx="12" cy="12" r="11" fill="#3897F0"/><path d="M7 12.5l3.2 3L17 9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const SHARE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>`;
const PLAY_ROUND = `<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="31" fill="rgba(14,20,48,.55)" stroke="#fff" stroke-width="2.5"/><path d="M26 20v24l19-12z" fill="#fff"/></svg>`;
const PLAY = `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M10 9.2v5.6l4.8-2.8z" fill="currentColor"/></svg>`;
const IG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>`;

function sparkline(vals, w, h) {
  if (vals.length < 2) return "";
  const min = Math.min(...vals), max = Math.max(...vals), span = (max - min) || 1;
  const pts = vals.map((v, i) => [i * w / (vals.length - 1), h - 3 - (v - min) / span * (h - 10)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const c = vals.at(-1) >= vals[0] ? "60,224,160" : "255,92,122";
  const id = "g" + Math.random().toString(36).slice(2, 8);
  return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgb(${c})" stop-opacity=".28"/><stop offset="1" stop-color="rgb(${c})" stop-opacity="0"/></linearGradient></defs>
    <path d="${d} L${w} ${h} L0 ${h} Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="rgb(${c})" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 1800); }
async function share(title, text) {
  const url = location.href;
  if (navigator.share) { try { await navigator.share({ title, text, url }); } catch {} return; }
  try { await navigator.clipboard.writeText(url); toast("Link copied"); } catch { toast(url); }
}

/* ---------------------------------------------------------------- rankings */
function showRankings() {
  current = null;
  document.title = `Rankings – ${SITE_NAME}`;
  const sports = [...new Set(DATA.players.filter(p => gender === "All" || p.gender === gender).map(p => p.sport).filter(Boolean))]
    .sort((a, b) => ((SPORT_ORDER.indexOf(a) + 1) || 99) - ((SPORT_ORDER.indexOf(b) + 1) || 99));
  if (!sports.includes(sport)) sport = "All";
  const inSport = DATA.players.filter(p => (sport === "All" || p.sport === sport) && (gender === "All" || p.gender === gender));
  const leagues = [...new Set(inSport.flatMap(p => p.leagues || [p.league]).filter(Boolean))]
    .sort((a, b) => ((LEAGUE_ORDER.indexOf(a) + 1) || 99) - ((LEAGUE_ORDER.indexOf(b) + 1) || 99) || a.localeCompare(b));
  if (!leagues.includes(league)) league = "All";
  const hasImports = inSport.some(p => p.import);
  const leagueList = leagues.length > 1 ? leagues.slice(0, -1).join(", ") + " & " + leagues.at(-1) : leagues[0] || "";
  const copy = SPORT_COPY[sport] || {
    headline: `Australian ${esc(sport.toLowerCase())}`,
    lede: `Followers and growth for every player in the ${esc(leagueList)}`,
    count: "players tracked",
  };
  const ranked = inSport.filter(p => p.followers != null);
  const total = ranked.reduce((s, p) => s + p.followers, 0);
  const weekGain = ranked.reduce((s, p) => s + (p.change_7d || 0), 0);
  $("main").innerHTML = `
    <section class="hero">
      <h1>${copy.headline}, ranked by <em>Instagram</em></h1>
      <p class="lede">Who's winning the feed. ${copy.lede}${SHOW_ENGAGEMENT ? ", plus engagement" : ""}, refreshed each morning.</p>
      <div class="totals">
        <div><b>${inSport.length}</b><span>${copy.count}</span></div>
        <div><b>${compact(total)}</b><span>combined followers</span></div>
        ${weekGain ? `<div><b class="${weekGain >= 0 ? "up" : "down"}">${weekGain >= 0 ? "+" : "−"}${compact(Math.abs(weekGain))}</b><span>followers this week</span></div>` : ""}
      </div>
    </section>
    ${DATA.sample_data ? `<div class="notice">Preview mode: these are made-up sample numbers. Real numbers and photos replace them after the first daily collection.</div>` : ""}
    ${sports.length > 1 ? `<div class="tabs sports" role="tablist" aria-label="Sport">
      ${["All", ...sports].map(x => `<button role="tab" data-sport="${esc(x)}" aria-selected="${x === sport}">${x === "All" ? "All sports" : esc(SPORT_LABEL[x] || x)}</button>`).join("")}
    </div>` : ""}
    ${leagues.length > 1 && (sport !== "All" || sports.length === 1) ? `<div class="tabs leagues" role="tablist" aria-label="League">
      ${["All", ...leagues].map(l => `<button role="tab" data-league="${esc(l)}" aria-selected="${l === league}">${l === "All" ? (sport === "All" ? "All leagues" : `All ${esc((SPORT_LABEL[sport] || sport).toLowerCase())}`) : esc(l)}</button>`).join("")}
    </div>` : ""}
    <div class="tabs views" role="tablist" aria-label="Ranking">
      ${Object.entries(VIEWS).map(([k, v]) => `<button role="tab" data-view="${k}" aria-selected="${k === view}">${v.tab}</button>`).join("")}
    </div>

      <div class="seg" role="group" aria-label="Men or women">

      </div>

function renderGrid() {
  const v = VIEWS[view];
  const q = query.trim().toLowerCase();
  const pool = DATA.players.filter(p => (sport === "All" || p.sport === sport) && (gender === "All" || p.gender === gender) &&
    (league === "All" || inLeague(p, league)) && !(aussiesOnly && p.import));
  // Rank first, then search, so a search shows each player's real rank.
  const ranked = pool.filter(p => p[v.key] != null).sort((a, b) => b[v.key] - a[v.key]);
  ranked.forEach((p, i) => p._rank = i + 1);
  const matches = p => !q || p.name.toLowerCase().includes(q) || (p.teams || []).some(t => t[1].toLowerCase().includes(q));
  const rows = ranked.filter(matches);
  const missing = pool.filter(p => p[v.key] == null && matches(p));
  if (!ranked.length) {
    $("grid").innerHTML = `<p class="waiting">${v.change
      ? "Growth rankings appear once there are enough days of history to compare. Check back after the first week of collection."
      : "No numbers yet. They appear after the first daily collection run."}</p>`;
    return;
  }
  const val = p => `<b class="${v.change ? (p[v.key] >= 0 ? "up" : "down") : ""}">${v.fmt(p[v.key])}</b>`;
  const chip = p => p.change_7d_pct == null || view === "growth7" ? ""
    : `<span class="chip ${p.change_7d_pct >= 0 ? "up" : "down"}">${signed(p.change_7d_pct)}% wk</span>`;

  if (!rows.length) {
    $("grid").innerHTML = `<p class="waiting">No players match "${esc(query)}".</p>`;
    return;
  }
  const page = rows.slice(0, shown);
  $("grid").innerHTML = `<div class="grid">${page.map((p, i) => {
    const href = `#/p/${encodeURIComponent(p.id)}`;
    const t = teamIn(p, league);
    const rank = p._rank;
    const shot = `
      <div class="shot">
        ${photo(p)}
        <span class="rank" aria-label="Rank ${rank}">${rank}</span>
        <div class="shot-foot">
          <span class="name">${nameLines(p.name)}${p.verified ? TICK : ""}</span>
          <span class="team">${esc(shortTeam(t.team, p.sport))} · ${esc(t.league)}</span>
        </div>
      </div>`;
    if (i === 0 && rank === 1) {
      const ch = (n, pct) => n == null ? "–" : `<span class="${n >= 0 ? "up" : "down"}">${exactSigned(n)}</span>`;
      return `
        <a class="card feature podium" href="${href}">
          ${shot}
          <div class="side">
            <span class="lead">No. 1 · ${esc(v.tab)}</span>
            <span class="big ${v.change ? (p[v.key] >= 0 ? "up" : "down") : ""}">${v.fmt(p[v.key])}</span>
            <span style="color:var(--muted)">${v.change && p[v.abs] != null ? `${exactSigned(p[v.abs])} followers ${v.label}` : v.label}</span>
            <div class="rows">
              <div>Followers <b>${compact(p.followers)}</b></div>
              <div>This week <b>${ch(p.change_7d)}</b></div>
              ${SHOW_ENGAGEMENT
                ? `<div>Engagement <b>${p.engagement_rate != null ? p.engagement_rate.toFixed(2) + "%" : "–"}</b></div>`
                : `<div>This month <b>${ch(p.change_30d)}</b></div>`}
            </div>
            <svg class="spark" viewBox="0 0 300 64" preserveAspectRatio="none" aria-hidden="true">${sparkline(p.spark || [], 300, 64)}</svg>
          </div>
        </a>`;
    }
    return `
      <a class="card${rank <= 3 ? " podium" : ""}" href="${href}">
        ${shot}
        <div class="meta"><div>${val(p)}<small>${v.change && p[v.abs] != null ? `${exactSigned(p[v.abs])} followers ${v.label}` : v.label}</small></div>${chip(p)}</div>
        <svg class="spark" viewBox="0 0 200 40" preserveAspectRatio="none" aria-hidden="true">${sparkline(p.spark || [], 200, 40)}</svg>
      </a>`;
  }).join("")}</div>
  ${rows.length > shown ? `<div class="more"><button class="btn" id="moreBtn">Show more players (${rows.length - shown} to go)</button></div>` : ""}
  ${missing.length ? `<details class="waiting"><summary>No numbers yet for ${missing.length} player${missing.length > 1 ? "s" : ""}</summary>
      <p>${missing.map(p => esc(p.name)).join(", ")}</p>
      <p>Usually their Instagram handle hasn't been found yet, or their account is personal rather than Creator or Business.</p></details>` : ""}`;
  $("moreBtn")?.addEventListener("click", () => { shown += PAGE_SIZE * 2; renderGrid(); });
}

/* Latest Instagram posts, reels first. The embeds only load when the section
   scrolls into view, so profiles stay fast on phones. */
function featuredCard(p) {

  if (!f || !f.thumb) return "";
  return `<section class="feature-hl" id="featured" data-url="${esc(f.url)}">
      <button class="hl-thumb" id="hlPlay" aria-label="Play ${esc(p.name)}'s latest ${f.type === "reel" ? "reel" : "post"}">
        <img src="${esc(f.thumb)}" alt="" loading="lazy">
        <span class="hl-play">${f.type === "reel" ? PLAY_ROUND : IG}</span>
      </button>
      <div class="hl-text">
        <span class="hl-kicker">${f.type === "reel" ? "Latest highlight" : "Latest post"}${f.date ? " · " + niceDate(f.date) : ""}</span>
        ${f.caption ? `<p class="hl-cap">${esc(f.caption)}${f.caption.length >= 160 ? "…" : ""}</p>` : ""}
        <div class="actions">
          <button class="btn primary" id="hlPlay2">${PLAY}${f.type === "reel" ? "Play here" : "View here"}</button>

function playFeatured() {
  const sec = $("featured");
  if (!sec) return;
  const thumb = sec.querySelector(".hl-thumb");
  const holder = document.createElement("div");
  holder.className = "hl-embed";
  holder.innerHTML = `<blockquote class="instagram-media" data-instgrm-permalink="${esc(sec.dataset.url)}?utm_source=ig_embed" data-instgrm-version="14"><a class="post-ph" href="${esc(sec.dataset.url)}" rel="noopener" target="_blank">${IG}<span>View on Instagram</span></a></blockquote>`;
  thumb.replaceWith(holder);
  $("hlPlay2")?.remove();
  loadInstagram();
}

function loadInstagram() {
  if (window.instgrm) { window.instgrm.Embeds.process(); return; }
  if (!igScript) {
    igScript = document.createElement("script");
    igScript.async = true;
    igScript.src = "https://www.instagram.com/embed.js";
    igScript.onload = () => window.instgrm && window.instgrm.Embeds.process();
    document.body.appendChild(igScript);
  }
}

function videoPanel(p) {
  // The featured post is shown separately, so leave it out of the strip.
  const recent = (p.recent || []).filter(m => !p.featured || m.url !== p.featured.url);
  if (!recent.length) return "";
  const reels = recent.filter(m => m.type === "reel");
  const picks = [...reels, ...recent.filter(m => m.type !== "reel")].slice(0, 6);
  return `<section class="panel" id="videos">
      <div class="chart-head">
        <div><h2>${reels.length ? "More reels and posts" : "More posts"}</h2>
        <p class="hint">From @${esc(p.instagram)} on Instagram.</p></div>
      </div>
      <div class="strip">${picks.map(m => `
        <div class="post" data-url="${esc(m.url)}">
          <a class="post-ph" href="${esc(m.url)}" rel="noopener" target="_blank">
            ${m.type === "reel" ? PLAY : IG}<span>${m.type === "reel" ? "Reel" : "Post"}${m.date ? " · " + niceDate(m.date) : ""}</span>
          </a>
        </div>`).join("")}
      </div>
    </section>`;
}

let igScript = null;
function loadVideosWhenVisible() {
  const sec = $("videos");
  if (!sec) return;
  const go = () => {
    sec.querySelectorAll(".post").forEach(el => {
      el.innerHTML = `<blockquote class="instagram-media" data-instgrm-permalink="${esc(el.dataset.url)}?utm_source=ig_embed" data-instgrm-version="14"><a class="post-ph" href="${esc(el.dataset.url)}" rel="noopener" target="_blank">${IG}<span>View on Instagram</span></a></blockquote>`;
    });
    loadInstagram();
  };
  if (!("IntersectionObserver" in window)) return go();
  const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { io.disconnect(); go(); } }, { rootMargin: "200px" });
  io.observe(sec);
}

function detailsPanel(d) {
  if (!d) return "";
  const age = d.birthdate ? Math.floor((Date.now() - new Date(d.birthdate + "T00:00:00")) / 31557600000) : null;
  const items = [
    [d.height_cm ? d.height_cm + " cm" : d.height, d.height ? `height · ${d.height.replace("-", "′")}″` : "height"],
    [age, d.birthdate ? `years old · born ${niceDate(d.birthdate, { day: "numeric", month: "short", year: "numeric" })}` : ""],
    [d.jersey ? "#" + d.jersey : null, "jersey"],
    [d.draft, "draft"],
    [d.college, "college or last team"],
    [d.first_season, "first season in the league"],
  ].filter(([v]) => v != null && v !== "");
  if (!items.length) return "";
  return `<section class="panel">
      <h2>Player details</h2>
      <p class="hint">From the league's official stats.</p>
      <div class="facts">${items.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join("")}</div>
    </section>`;
}

function drawChart() {
  const box = $("chart"), tip = $("tip");
  if (!box || !current) return;
  const all = current.history.filter(h => h[1] != null);
  const days = RANGES[range];
  const last = all.length ? new Date(all.at(-1)[0]) : null;
  const pts = all.filter(h => days === Infinity || (last - new Date(h[0])) / 864e5 <= days);
  box.querySelector("svg")?.remove();
  if (pts.length < 2) { $("chartHint").textContent = "The chart fills in as daily numbers are collected."; return; }
  const change = pts.at(-1)[1] - pts[0][1];
  $("chartHint").innerHTML = `<span class="${change >= 0 ? "up" : "down"}">${exactSigned(change)}</span> since ${niceDate(pts[0][0], { day: "numeric", month: "short", year: "numeric" })}`;

  const W = box.clientWidth, H = box.clientHeight, L = 50, R = 6, T = 12, B = 26;
  const vals = pts.map(p => p[1]);
  let min = Math.min(...vals), max = Math.max(...vals);
  const pad = (max - min) * .12 || max * .01 || 1; min -= pad; max += pad;
  const x = i => L + i * (W - L - R) / (pts.length - 1);
  const y = v => T + (max - v) / (max - min) * (H - T - B);
  const d = pts.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p[1]).toFixed(1)).join(" ");
  const grid = [0, .5, 1].map(f => {
    const v = min + (max - min) * (1 - f), yy = T + f * (H - T - B);
    return `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text class="lbl" x="${L - 8}" y="${yy + 4}" text-anchor="end">${compact(Math.round(v))}</text>`;
  }).join("");
  const xl = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].map((i, k) =>
    `<text class="lbl" x="${x(i)}" y="${H - 6}" text-anchor="${["start", "middle", "end"][k]}">${niceDate(pts[i][0])}</text>`).join("");

  box.insertAdjacentHTML("afterbegin", `
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Followers over time">
      <defs><linearGradient id="fillG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A1A" stop-opacity=".32"/><stop offset="1" stop-color="#FF7A1A" stop-opacity="0"/></linearGradient></defs>
      ${grid}${xl}
      <path d="${d} L${x(pts.length - 1)} ${H - B} L${L} ${H - B} Z" fill="url(#fillG)"/>
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${x(pts.length - 1)}" cy="${y(pts.at(-1)[1])}" r="5" fill="var(--accent)"/>
      <line id="hl" y1="${T}" y2="${H - B}" stroke="rgba(255,255,255,.4)" stroke-dasharray="3 3" visibility="hidden"/>
      <circle id="hd" r="6" fill="var(--bg)" stroke="var(--accent)" stroke-width="3" visibility="hidden"/>
    </svg>`);
  const svg = box.querySelector("svg"), hl = svg.querySelector("#hl"), hd = svg.querySelector("#hd");
  svg.addEventListener("pointermove", e => {
    const px = e.clientX - svg.getBoundingClientRect().left;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((px - L) / (W - L - R) * (pts.length - 1))));
    hl.setAttribute("x1", x(i)); hl.setAttribute("x2", x(i)); hd.setAttribute("cx", x(i)); hd.setAttribute("cy", y(pts[i][1]));
    hl.setAttribute("visibility", "visible"); hd.setAttribute("visibility", "visible");
    tip.style.display = "block"; tip.style.left = Math.max(64, Math.min(W - 64, x(i))) + "px";
    tip.innerHTML = `<b>${pts[i][1].toLocaleString("en-AU")}</b>${niceDate(pts[i][0], { day: "numeric", month: "short", year: "numeric" })}`;
  });
  svg.addEventListener("pointerleave", () => { hl.setAttribute("visibility", "hidden"); hd.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
}

/* ---------------------------------------------------------------- routing */
function route() {
  document.querySelectorAll(".nav details[open]").forEach(d => d.removeAttribute("open"));
  const h = location.hash;
  const m = h.match(/^#\/p\/(.+)$/);
  if (m) return showProfile(decodeURIComponent(m[1]));
  if (h.startsWith("#/rankings")) {
    const q = new URLSearchParams(h.split("?")[1] || "");
    if (q.toString()) {            // a menu link: start from its filters
      sport = q.get("sport") || "All"; league = q.get("league") || "All";
      gender = q.get("gender") || "All"; query = ""; shown = PAGE_SIZE;
      if (q.get("view") && VIEWS[q.get("view")]) view = q.get("view");
    }
    showRankings();
    window.scrollTo(0, 0);
    return;
  }
  showHome();
}

/* ---------------------------------------------------------------- menu */
function link(params) {
  const q = new URLSearchParams(Object.entries(params).filter(([, v]) => v && v !== "All"));
  return "#/rankings" + (q.toString() ? "?" + q : "");
}
function buildNav() {
  const sports = [...new Set(DATA.players.map(p => p.sport).filter(Boolean))]
    .sort((a, b) => ((SPORT_ORDER.indexOf(a) + 1) || 99) - ((SPORT_ORDER.indexOf(b) + 1) || 99));
  const count = f => DATA.players.filter(f).length;
  const sportMenu = sports.map(sp => {
    const label = SPORT_LABEL[sp] || sp;
    const leagues = [...new Set(DATA.players.filter(p => p.sport === sp).flatMap(p => p.leagues || [p.league]))]
      .sort((a, b) => ((LEAGUE_ORDER.indexOf(a) + 1) || 99) - ((LEAGUE_ORDER.indexOf(b) + 1) || 99));
    const genderOf = lg => (DATA.players.find(p => inLeague(p, lg)) || {}).gender;
    if (leagues.length <= 1) return `<a href="${link({ sport: sp })}">${esc(label)} <small>${count(p => p.sport === sp)}</small></a>`;
    const group = g => {
      const ls = leagues.filter(l => genderOf(l) === g);
      return ls.length ? `<a href="${link({ sport: sp, gender: g })}">${GENDER_LABEL[g]}'s ${esc(label.toLowerCase())} <small>${ls.join(", ")}</small></a>
        <div class="sub">${ls.map(l => `<a href="${link({ sport: sp, league: l })}">${esc(l)} <small>${count(p => inLeague(p, l))}</small></a>`).join("")}</div>` : "";
    };
    return `<h4>${esc(label)}</h4><a href="${link({ sport: sp })}">All ${esc(label.toLowerCase())} <small>${count(p => p.sport === sp)}</small></a>${group("men")}${group("women")}`;
  }).join(sports.length > 1 ? "<hr>" : "");
  $("nav").innerHTML = `
    <a href="#/">Home</a>
    <details><summary>Athletes</summary><div class="menu">
      <a href="${link({ gender: "men" })}">Men <small>${count(p => p.gender === "men")}</small></a>
      <a href="${link({ gender: "women" })}">Women <small>${count(p => p.gender === "women")}</small></a>
      <hr><a href="#/rankings?all=1">All athletes <small>${DATA.players.length}</small></a>
    </div></details>
    <details><summary>Sports</summary><div class="menu">${sportMenu}</div></details>`;
  // Only one menu open at a time; clicking elsewhere closes them.
  $("nav").querySelectorAll("details").forEach(d => d.addEventListener("toggle", () => {
    if (d.open) $("nav").querySelectorAll("details").forEach(o => o !== d && o.removeAttribute("open"));
  }));
  document.addEventListener("click", e => {
    if (!e.target.closest(".nav")) $("nav").querySelectorAll("details[open]").forEach(d => d.removeAttribute("open"));
  });
}

/* ---------------------------------------------------------------- home */
// Growth "this week": the real 7-day figure once there is a week of history,
// otherwise growth since tracking began (growth_days says how long).
function weekGrowth(p) {
  if (p.change_7d_pct != null) return { pct: p.change_7d_pct, n: p.change_7d, days: 7 };
  if (p.growth_pct != null) return { pct: p.growth_pct, n: p.growth, days: p.growth_days };
  return null;
}
const TOP_PROFILE_MIN = 10000;   // "Top profiles this week" only includes accounts with at least this many followers
let topTab = "All";

// Top profiles this week: men and women together, ranked by growth %, so a
// fast-growing 60K account can beat a huge account that barely moved.
// Until there are two days of numbers it falls back to followers, alternating
// men and women so the first look isn't one-sided.
function topProfiles(g) {
  const pool = DATA.players.filter(p => p.followers != null && p.followers >= TOP_PROFILE_MIN && (g === "All" || p.gender === g));
  const grown = pool.map(p => ({ p, g: weekGrowth(p) })).filter(x => x.g && x.g.pct != null);
  if (grown.filter(x => x.g.pct > 0).length >= 5) {
    grown.sort((a, b) => b.g.pct - a.g.pct || b.p.followers - a.p.followers);
    return { byGrowth: true, days: Math.max(...grown.map(x => x.g.days || 0)), list: grown.slice(0, 10) };
  }
  const byF = list => list.sort((a, b) => b.followers - a.followers).map(p => ({ p, g: weekGrowth(p) }));
  let list;
  if (g === "All") {
    const m = byF(pool.filter(p => p.gender === "men")), w = byF(pool.filter(p => p.gender === "women"));
    list = [];
    for (let i = 0; list.length < 10 && (i < m.length || i < w.length); i++) { if (w[i]) list.push(w[i]); if (m[i]) list.push(m[i]); }
    list = list.slice(0, 10);
  } else list = byF(pool).slice(0, 10);
  return { byGrowth: false, days: 0, list };
}
// Up & coming skips anyone already in the Top profiles list, so the two don't repeat.
function upAndComing(skip = new Set()) {
  return DATA.players.filter(p => p.followers != null && !skip.has(p.id))
    .map(p => ({ p, g: weekGrowth(p) }))
    .filter(x => x.g && x.g.pct > 0 && x.p.followers < UP_AND_COMING_CAP)
    .sort((a, b) => b.g.pct - a.g.pct).slice(0, 6);
}
// Combined growth of each team, league or sport.
function growthGroups(by) {
  const groups = {};
  for (const p of DATA.players) {
    const g = weekGrowth(p);
    if (!g || p.followers == null) continue;
    const keys = by === "sport" ? [[p.sport, SPORT_LABEL[p.sport] || p.sport, ""]]
      : by === "league" ? (p.leagues || [p.league]).map(l => [l, l, SPORT_LABEL[p.sport] || p.sport])
      : (p.teams || []).map(t => [t[0] + "|" + t[1], t[1], t[0]]);
    for (const [k, name, sub] of keys) {
      const x = groups[k] ||= { name, sub, now: 0, before: 0, n: 0, days: 0 };
      x.now += p.followers; x.before += p.followers - (g.n || 0); x.n += 1; x.days = Math.max(x.days, g.days || 0);
    }
  }
  const minAthletes = by === "team" ? 3 : 1;
  return Object.values(groups).filter(x => x.n >= minAthletes && x.before > 0 && x.now !== x.before)
    .map(x => ({ ...x, pct: 100 * (x.now - x.before) / x.before, gain: x.now - x.before }))
    .sort((a, b) => b.pct - a.pct).slice(0, 5);
}
const href = p => `#/p/${encodeURIComponent(p.id)}`;
const ring = (p, cls = "") => `<span class="ring ${cls}">${photo(p)}</span>`;
const growthTxt = g => g && g.pct != null && g.n ? `${g.pct >= 0 ? "▲" : "▼"} ${Math.abs(g.pct) < 10 ? Math.abs(g.pct).toFixed(1) : Math.abs(g.pct).toFixed(0)}%` : "";
function teamLine(p) { const t = teamIn(p, "All"); return `${esc(shortTeam(t.team, p.sport))} · ${esc(t.league)}`; }

function showHome() {
  current = null;
  document.title = `${SITE_NAME} – Australia's athletes, ranked by Instagram`;
  const withF = DATA.players.filter(p => p.followers != null);
  const total = withF.reduce((s, p) => s + p.followers, 0);
  const tp = topProfiles("All");
  const cover = tp.list[0];
  const rising = upAndComing(new Set(tp.byGrowth ? tp.list.map(x => x.p.id) : []));
  const leagues = growthGroups("league");
  const mostF = g => withF.filter(p => p.gender === g).sort((a, b) => b.followers - a.followers);
  const hottest = [rising[0], tp.byGrowth ? tp.list[0] : null].filter(Boolean).sort((a, b) => b.g.pct - a.g.pct)[0];
  const sportsCount = new Set(DATA.players.map(p => p.sport)).size;
  const days = Math.max(0, ...rising.map(x => x.g.days || 0));
  const window_ = days && days < 7 ? `last ${days} day${days > 1 ? "s" : ""}` : "this week";

  const tick = [
    tp.byGrowth && cover ? ["Top profile", `${cover.p.name} ${growthTxt(cover.g)}`] : null,
    rising[0] ? ["Hot this week", `${rising[0].p.name} +${rising[0].g.pct.toFixed(1)}%`] : null,
    leagues[0] ? ["Fastest league", `${leagues[0].name} ${signed(leagues[0].pct)}%`] : null,
    mostF("women")[0] ? ["Most followed woman", `${mostF("women")[0].name} · ${compact(mostF("women")[0].followers)}`] : null,
    mostF("men")[0] ? ["Most followed man", `${mostF("men")[0].name} · ${compact(mostF("men")[0].followers)}`] : null,
    ["Tracking", `${DATA.players.length} athletes · ${sportsCount} sports`],
  ].filter(Boolean).map(([k, v]) => `<span>${esc(k)} <b>${esc(v)}</b></span>`).join("");

  const coverG = cover ? cover.g : null;
  $("main").innerHTML = `
    ${DATA.sample_data ? `<div class="notice" style="margin-top:20px">Preview mode: these are made-up sample numbers.</div>` : ""}
    <section class="stories" aria-label="Top profiles this week">
      <div class="stories-row">${tp.list.map(({ p, g }) => `
        <a class="story" href="${href(p)}">${ring(p)}<b>${esc(p.name.split(" ").slice(-1)[0])}</b><small class="up">${growthTxt(g)}</small></a>`).join("")}
      </div>
      <span class="hand stories-note">← tap a ring to open their profile</span>
    </section>

    <section class="mx-hero">
      <div>
        <div class="kicker">The weekly programme · Australian athletes on Instagram</div>
        <h1>Who's winning the <em>feed</em> this week</h1>
        <p class="lede">Followers, growth and the hottest profiles from ${DATA.players.length} Australian athletes, from the NBA to the AFLW. Updated every morning; collected like a footy card set.</p>
        <div class="stats">
          <div><small>Athletes</small><b>${DATA.players.length}</b></div>
          <div><small>Combined reach</small><b>${compact(total)}</b></div>
          ${hottest ? `<div><small>Hottest</small><b class="up">+${hottest.g.pct.toFixed(1)}%</b></div>` : ""}
        </div>
        ${cover ? `<div class="hand hero-note">this week's top profile →</div>` : ""}
      </div>
      ${cover ? `<div class="cover-wrap">
        <a class="tcard cover" href="${href(cover.p)}">
          <span class="tape"></span>
          <span class="pic">${photo(cover.p)}<span class="handle">@${esc(cover.p.instagram)}</span></span>
          <span class="nm">${esc(cover.p.name)}${cover.p.verified ? TICK : ""}</span>
          <span class="foot"><span>${teamLine(cover.p)}</span><span>${exact(cover.p.followers)} followers</span></span>
        </a>
        <span class="stamp"><span>${tp.byGrowth ? "Top" : "Most"}<b>#1</b>${tp.byGrowth ? "profile" : "followed"}</span></span>
        ${coverG && coverG.n ? `<span class="hand cover-note">${exactSigned(coverG.n)} ${days && days < 7 ? "so far" : "this week"}!</span>` : ""}
      </div>` : ""}
    </section>

    <div class="ticker" aria-label="This week"><div class="ticker-in">${tick}${tick}</div></div>

    <section class="mx-sec" id="topProfiles"></section>

    <section class="mx-sec">
      <div class="sechead"><h2>Most followed</h2><span class="hand">the big names</span><span class="sechint">Instagram followers today</span></div>
      <div class="mf">${["women", "men"].map(g => `
        <div class="mf-col"><h3>${GENDER_LABEL[g]}</h3>
          ${mostF(g).slice(0, 10).map((p, i) => `<a class="lrow" href="${href(p)}"><span class="n">${i + 1}</span>${ring(p, "sm")}
            <span class="who"><b>${esc(p.name)}</b><small>${teamLine(p)}</small></span>
            <span class="val"><b>${compact(p.followers)}</b>${p.change_7d != null ? `<small class="${p.change_7d >= 0 ? "up" : "down"}">${exactSigned(p.change_7d)}</small>` : ""}</span></a>`).join("") || `<p class="empty">No numbers yet.</p>`}
          <a class="all" href="${link({ gender: g })}">See all ${GENDER_LABEL[g].toLowerCase()} →</a>
        </div>`).join("")}
      </div>
    </section>

    <section class="mx-lower">
      <div>
        <div class="sechead"><h2>Up &amp; coming</h2><span class="hand">admit one</span><span class="sechint">Under ${compact(UP_AND_COMING_CAP)} followers · growth ${window_}</span></div>
        ${rising.length ? `<div class="stubs">${rising.map((x, i) => `<a class="stub" href="${href(x.p)}"><span class="n">${i + 1}</span>${ring(x.p, "sm")}
          <span class="who"><b>${esc(x.p.name)}</b><small>${teamLine(x.p)}</small></span>
          <span class="pct">+${x.g.pct.toFixed(1)}%<small>${compact(x.p.followers)} followers</small></span></a>`).join("")}</div>`
          : `<p class="empty">Growth rankings start once there are two days of numbers. Check back tomorrow.</p>`}
        <a class="all" href="#/rankings?view=growth7">See who's hot →</a>
      </div>
      <div><section class="board" id="widget"></section><div class="hand board-note">chalked up every morning ✎</div></div>
    </section>`;
  renderTopProfiles();
  renderWidget("league");
  window.scrollTo(0, 0);
}

function renderTopProfiles() {
  const tp = topProfiles(topTab);
  const tilt = [-2, 1.5, -1, 2, -1.5];
  const cards = tp.list.slice(0, 5).map(({ p, g }, i) => `
    <a class="tcard" href="${href(p)}" style="--tilt:${tilt[i]}deg">
      <span class="tape"></span>
      <span class="pic">${photo(p)}<span class="handle">@${esc(p.instagram)}</span><span class="big-n" aria-label="Rank ${i + 1}">${i + 1}</span></span>
      <span class="nm">${esc(p.name)}${p.verified ? TICK : ""}</span>
      <span class="tm">${teamLine(p)}</span>
      <span class="foot"><b>${compact(p.followers)}</b>${g && g.n ? `<span class="${g.pct >= 0 ? "gr" : "dn"}">${growthTxt(g)}</span>` : ""}</span>
    </a>`).join("");
  const rest = tp.list.slice(5).map(({ p, g }, i) => `<a class="lrow" href="${href(p)}"><span class="n">${i + 6}</span>${ring(p, "sm")}
      <span class="who"><b>${esc(p.name)}</b><small>${teamLine(p)}</small></span>
      <span class="val"><b>${compact(p.followers)}</b>${g && g.n ? `<small class="up">${growthTxt(g)}</small>` : ""}</span></a>`).join("");
  const how = tp.byGrowth
    ? `Biggest follower growth ${tp.days && tp.days < 7 ? `over the last ${tp.days} day${tp.days > 1 ? "s" : ""}` : "this week"} · ${compact(TOP_PROFILE_MIN)}+ followers`
    : "Ranked by followers until the growth numbers arrive";
  $("topProfiles").innerHTML = `
    <div class="sechead"><h2>Top profiles this week</h2><span class="hand">the collectables</span>
      <div class="pills" role="group" aria-label="Show">${[["All", "All"], ["women", "Women"], ["men", "Men"]].map(([k, l]) =>
        `<button data-g="${k}" aria-pressed="${k === topTab}">${l}</button>`).join("")}</div></div>
    <p class="sechint" style="margin:-22px 0 26px">${how}</p>
    ${tp.list.length ? `<div class="tp"><div class="tcards">${cards}</div>
      ${rest ? `<div class="tp-rest"><div class="mini-h">Also in the top 10</div>${rest}</div>` : ""}</div>`
      : `<p class="empty">No numbers yet.</p>`}`;
  $("topProfiles").querySelector(".pills").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    topTab = b.dataset.g; renderTopProfiles();
  });
}

// "Fastest growing": top 5 teams, leagues or sports by combined follower growth.
function renderWidget(by) {
  const ranked = growthGroups(by);
  const days = Math.max(0, ...ranked.map(x => x.days));
  const max = Math.max(...ranked.map(x => Math.abs(x.pct)), 0.0001);
  const tabs = [["league", "Leagues"], ["team", "Teams"], ["sport", "Sports"]];
  const label = { league: "leagues", team: "teams", sport: "sports" }[by];
  $("widget").innerHTML = `
    <div class="board-head"><h3>Fastest growing ${label}</h3>
      <div class="pills sm" role="group" aria-label="Group by">${tabs.map(([k, l]) => `<button data-by="${k}" aria-pressed="${k === by}">${l}</button>`).join("")}</div></div>
    <div class="board-sub">Combined follower growth · ${days && days < 7 ? `last ${days} day${days > 1 ? "s" : ""}` : "this week"}${by === "team" ? " · teams with 3+ athletes" : ""}</div>
    ${ranked.length ? ranked.map((x, i) => `<div class="brow"><span class="n">${i + 1}</span>
        <div><span class="bn">${esc(x.name)}</span>${x.sub ? `<small> ${esc(x.sub)}</small>` : ""}<div class="bar" style="width:${Math.max(4, Math.abs(x.pct) / max * 100).toFixed(0)}%"></div></div>
        <span class="${x.pct >= 0 ? "up" : "down"}">${signed(x.pct)}%</span></div>`).join("")
      : `<p class="board-sub" style="margin-top:14px">This fills in once there are two days of numbers.</p>`}`;
  $("widget").querySelector(".pills").addEventListener("click", e => {
    const b = e.target.closest("button"); if (b) renderWidget(b.dataset.by);
  });
}
let resizeTimer;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(drawChart, 150); });
window.addEventListener("hashchange", route);

fetch("data.json", { cache: "no-store" }).then(r => r.json()).then(d => {
  DATA = d;
  const asOf = d.players.map(p => p.as_of).filter(Boolean).sort().at(-1);
  const sp = SITE_NAME.lastIndexOf(" ");
  $("siteName").innerHTML = sp > 0 ? `${esc(SITE_NAME.slice(0, sp))} <b>${esc(SITE_NAME.slice(sp + 1))}</b>` : esc(SITE_NAME);
  buildNav();
  if (asOf) $("updated").innerHTML = `<span class="live"></span>Updated ${niceDate(asOf, { day: "numeric", month: "short" })}`;
  route();
}).catch(() => {
  $("main").innerHTML = '<p class="notice" style="margin-top:32px">The rankings file couldn\'t be loaded. If you opened this page straight from your computer, preview it through GitHub Pages instead.</p>';
});
</script>
