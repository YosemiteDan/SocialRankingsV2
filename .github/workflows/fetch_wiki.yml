# Run by hand: saves Wikipedia squad pages (data/wiki/) so club players can be added.
name: Fetch squad pages
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Search terms, separated by ;"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: IFS=';' read -ra P <<< "${{ inputs.pages }}"; python scripts/fetch_wiki.py "${P[@]}"
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wiki
          git diff --cached --quiet || git commit -m "Squad pages"
          for attempt in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 10; done
