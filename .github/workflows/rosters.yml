# Run by hand: current players at the clubs we cover, from Wikidata (data/roster_candidates.csv).
name: Find club players
on: workflow_dispatch
permissions:
  contents: write
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scripts/rosters.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/roster_candidates.csv
          git diff --cached --quiet || git commit -m "Club player candidates"
          for attempt in 1 2 3; do git pull --rebase --autostash -X theirs && git push && exit 0; sleep 10; done
